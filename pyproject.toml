[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
name = "unicode-source-review"
version = "1.0.2"
description = "Offline, bounded Unicode control-character evidence for source review"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = []

[project.scripts]
unicode-source-review = "unicode_source_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/UnicodeSourceReview" = ["ORIGIN.md", "DEFENSIVE_SCOPE.md", "VALIDATION.md", "SOURCE_REVIEW_MANIFEST.json"]
